[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 60000
points_awarded = 1000
title = "¿Qué haces cuando un cherry-pick genera conflictos?"
answer_mode = "MultipleAnswers"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Resolver los conflictos manualmente y ejecutar git cherry-pick --continue" }
[[slides.MultipleChoice.answers]]
correct = true
