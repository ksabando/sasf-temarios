[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 30000
points_awarded = 1000
title = "M06 - En un merge fast-forward, ¿qué ocurre?"
answer_mode = "SingleAnswer"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Git mueve el puntero de la rama destino linealmente sin crear un commit de merge" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Se crea siempre un commit adicional de fusión" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Se borra automáticamente la rama fuente" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Git obliga a resolver conflictos manualmente" }

