title = "M19 - Git Worktrees"

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 30000
points_awarded = 1000
title = "¿Qué es un worktree de Git?"
answer_mode = "SingleAnswer"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Un directorio de trabajo adicional vinculado al mismo repositorio que permite tener múltiples ramas abiertas simultáneamente" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Una copia del repositorio completo creada con git clone" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Una visualización en forma de árbol del grafo de commits" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Un stash de cambios no commiteados" }

