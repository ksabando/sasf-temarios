[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cuál es la relación entre Compound Components y OCP en React?"
points_awarded = 1000
answer_mode = "TypeAnswer"
case_sensitive = false
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "El componente padre está cerrado a modificación pero abierto a extensión mediante la composición flexible de componentes hijos" }
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Se pueden agregar nuevas variantes de hijos sin modificar el componente padre, cumpliendo OCP" }

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Qué patrón usarías para evitar pasar 10 props a un componente aplicando ISP?"
