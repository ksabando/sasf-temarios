[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Convertir todas las props en un solo string JSON" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Ignorar ISP y mantener el componente grande porque es más fácil de mantener" }

