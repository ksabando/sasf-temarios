[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cuál es la diferencia clave entre una violación de LSP y una violación de OCP?"
points_awarded = 1000
answer_mode = "TypeAnswer"
case_sensitive = false
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "LSP trata de la sustituibilidad entre subtipos; OCP trata de la extensibilidad sin modificar código existente" }
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "LSP es sobre relaciones entre clases; OCP es sobre cómo agregar funcionalidad" }

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cuáles son condiciones para usar herencia sin violar LSP? (Selecciona 2)"
points_awarded = 1000
answer_mode = "MultipleAnswers"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "La subclase mantiene todos los comportamientos de la clase base sin rechazar ninguno" }
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "La subclase no fortalece precondiciones ni debilita postcondiciones" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "La subclase debe tener al menos el doble de métodos que la clase base" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "La clase base debe ser abstracta y no tener implementaciones concretas" }
