[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cuándo NO deberías refactorizar código legacy?"
points_awarded = 1000
answer_mode = "TypeAnswer"
case_sensitive = false
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Cuando el código va a ser reemplazado pronto o descontinuado, sin pruebas de respaldo, o con un deadline inminente" }
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Sin pruebas, sin control de versiones, o si el módulo será eliminado en poco tiempo" }

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cuál es la diferencia entre refactorización y reescritura?"
points_awarded = 1000
answer_mode = "SingleAnswer"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Refactorización son cambios incrementales que mejoran la estructura sin alterar el comportamiento; reescritura es desechar el código y escribirlo desde cero" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Son exactamente lo mismo, solo que refactorización es el término en inglés" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Refactorización se hace en backend y reescritura en frontend" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Reescritura es siempre preferible porque elimina toda la deuda técnica de una vez" }

