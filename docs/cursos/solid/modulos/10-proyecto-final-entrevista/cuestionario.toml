[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "En aplicaciones empresariales con lógica de negocio compleja" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "En sistemas que requieren mantenimiento a largo plazo" }
