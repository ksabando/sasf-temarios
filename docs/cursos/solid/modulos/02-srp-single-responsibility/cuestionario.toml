title = "Módulo 02 - SRP (Single Responsibility Principle)"

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cuál es la definición formal del Single Responsibility Principle según Robert C. Martin?"
points_awarded = 1000
answer_mode = "SingleAnswer"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Una clase debe tener una sola razón para cambiar" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Una clase debe tener exactamente un método público" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Una clase debe heredar de una sola clase padre" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Una clase debe implementar una sola interfaz" }

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cuántas razones para cambiar tiene una clase que valida datos, calcula impuestos y guarda en base de datos?"
points_awarded = 1000
answer_mode = "SingleAnswer"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Tres razones: cambio en reglas de validación, cambio en reglas de cálculo de impuestos y cambio en esquema de base de datos" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Una razón: cualquier cambio en el sistema requiere modificar esta clase" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Dos razones: cambios en el frontend y cambios en el backend" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Ninguna razón, ya que la clase maneja todo lo necesario" }

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cómo promueve Spring Boot el SRP mediante anotaciones de estereotipo?"
points_awarded = 1000
answer_mode = "SingleAnswer"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "@Controller para HTTP, @Service para lógica de negocio y @Repository para acceso a datos, cada una con una responsabilidad única" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "@Autowired para todas las dependencias sin importar la responsabilidad" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "@Component para todas las clases sin distinción de capa" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "@Entity para manejar tanto la lógica de negocio como la persistencia" }

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cuáles son pruebas prácticas para detectar si una clase viola SRP? (Selecciona 2)"
points_awarded = 1000
answer_mode = "MultipleAnswers"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "La prueba del 'y también': si describes la clase con 'hace X y también Y y también Z'" }
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "La prueba de los actores: si más de un tipo de persona podría pedir un cambio en la clase" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "La prueba de rendimiento: si la clase tarda más de 100ms en ejecutarse" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "La prueba de herencia: si la clase extiende más de una clase base" }

