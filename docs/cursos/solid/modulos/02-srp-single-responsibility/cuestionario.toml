[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Siempre que la clase tenga menos de 500 líneas de código" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Nunca, SRP debe aplicarse estrictamente en todo momento sin excepciones" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Solo cuando se usa Spring Boot, ya que el framework maneja las responsabilidades" }

