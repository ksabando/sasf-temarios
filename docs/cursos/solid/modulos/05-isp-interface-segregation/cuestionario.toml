[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Qué ventajas tienen las interfaces funcionales de Java (@FunctionalInterface) desde la perspectiva de ISP?"
points_awarded = 1000
answer_mode = "TypeAnswer"
case_sensitive = false
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Son el ejemplo máximo de segregación: cada interfaz representa una capacidad única con un solo método abstracto" }
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Cada cliente depende solo de la capacidad exacta que necesita sin métodos adicionales" }

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cuándo es aceptable tener una interfaz con varios métodos sin violar ISP?"
points_awarded = 1000
answer_mode = "SingleAnswer"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Cuando los métodos están fuertemente relacionados y siempre se usan juntos, como Collection.add(), remove(), size()" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Siempre que la interfaz tenga menos de 20 métodos" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Nunca, ISP exige que cada interfaz tenga exactamente un método" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Solo cuando la interfaz se usa exclusivamente en pruebas unitarias" }

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cuál es la relación entre ISP y SRP (Single Responsibility Principle)?"
points_awarded = 1000
answer_mode = "MultipleAnswers"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "ISP aplica SRP a nivel de interfaces: cada interfaz debe representar un solo rol" }
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Ambos buscan que los componentes sean cohesivos y específicos en sus responsabilidades" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "ISP y SRP son el mismo principio con diferente nombre" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "ISP reemplaza a SRP cuando se trabaja con interfaces en lugar de clases" }
