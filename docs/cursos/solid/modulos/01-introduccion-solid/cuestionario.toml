points_awarded = 1000
answer_mode = "TypeAnswer"
case_sensitive = false
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "La cantidad de caminos independientes en el código" }
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Los caminos independientes de ejecución" }

