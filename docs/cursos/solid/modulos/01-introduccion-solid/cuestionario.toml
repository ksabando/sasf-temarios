[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cuál es la principal diferencia entre acoplamiento (coupling) y cohesión (cohesion)?"
points_awarded = 1000
answer_mode = "SingleAnswer"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "El acoplamiento mide dependencia entre módulos (bajo es bueno); la cohesión mide relación de responsabilidades dentro de un módulo (alto es bueno)" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "El acoplamiento mide la cantidad de métodos; la cohesión mide la cantidad de clases en un paquete" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "El acoplamiento mide líneas de código; la cohesión mide la complejidad ciclomática" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Ambos miden lo mismo pero desde perspectivas diferentes: uno a nivel de clase y otro a nivel de paquete" }

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cuáles de las siguientes son características del código espagueti? (Selecciona 2)"
points_awarded = 1000
answer_mode = "MultipleAnswers"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Mezcla de responsabilidades (validación, lógica, presentación en un mismo método)" }
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Uso excesivo de condicionales anidados y switches" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Uso extensivo de interfaces y clases abstractas para cada variante" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Separación estricta en capas con inyección de dependencias" }

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Qué es una God Class?"
points_awarded = 1000
answer_mode = "SingleAnswer"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Una clase que concentra demasiadas responsabilidades no relacionadas (validación, persistencia, lógica de negocio, presentación)" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Una clase abstracta que define la interfaz común para toda una jerarquía de herencia" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Una clase que implementa correctamente todos los principios SOLID de forma ejemplar" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Una clase utilitaria con métodos estáticos usados por todo el sistema" }

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
