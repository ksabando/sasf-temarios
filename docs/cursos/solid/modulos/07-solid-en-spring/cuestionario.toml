[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cuál es la diferencia entre IoC (Inversion of Control) y DIP en el contexto de Spring?"
points_awarded = 1000
answer_mode = "SingleAnswer"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "IoC es sobre quién controla las dependencias (el contenedor); DIP es sobre el tipo de dependencias (abstracciones, no detalles)" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "IoC y DIP son sinónimos en Spring y se refieren a lo mismo" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "IoC se aplica en el frontend y DIP en el backend" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "DIP es un subconjunto de IoC que solo aplica a anotaciones @Autowired" }

