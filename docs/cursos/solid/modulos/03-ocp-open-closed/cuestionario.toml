title = "Módulo 03 - OCP (Open/Closed Principle)"

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cuál es la definición del Open/Closed Principle?"
points_awarded = 1000
answer_mode = "SingleAnswer"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Las entidades de software deben estar abiertas para extensión pero cerradas para modificación" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Las clases deben estar abiertas para modificación pero cerradas para herencia" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Los métodos deben ser públicos (abiertos) dentro del paquete y privados (cerrados) fuera de él" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "El código fuente debe ser open source para permitir extensión comunitaria" }

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cuál es el anti-patrón más común que viola OCP?"
points_awarded = 1000
answer_mode = "SingleAnswer"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "El switch/if-else gigante que debe modificarse cada vez que se agrega una nueva variante" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "El uso de interfaces con un solo método abstracto" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "La inyección de dependencias por constructor" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "El uso de clases abstractas como base para jerarquías" }

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cómo resuelve el patrón Strategy la violación de OCP?"
points_awarded = 1000
answer_mode = "SingleAnswer"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Encapsula cada algoritmo en su propia clase que implementa una interfaz común; para agregar una variante solo se crea una nueva clase sin modificar las existentes" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Centraliza todas las variantes en un solo método con un switch que se actualiza manualmente" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Convierte todas las variantes en clases estáticas que se cargan por reflexión" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Elimina todas las clases concretas y usa solo funciones lambda" }

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cuál es la diferencia entre Strategy Pattern y Template Method Pattern?"
points_awarded = 1000
answer_mode = "SingleAnswer"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Strategy encapsula algoritmos completos intercambiables usando composición; Template Method define el esqueleto con pasos fijos y variables usando herencia" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Strategy usa herencia y Template Method usa composición" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Ambos son idénticos pero Strategy se usa en Java y Template Method en C#" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Strategy no requiere interfaces mientras que Template Method sí" }

[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 15000
title = "¿Cuáles son señales de que un código viola OCP? (Selecciona 2)"
points_awarded = 1000
answer_mode = "MultipleAnswers"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Tener que modificar una clase existente para agregar nueva funcionalidad" }
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Métodos con nombres como processType1, processType2, handleVariantA" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Uso de interfaces con múltiples implementaciones intercambiables" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Inyección de una lista de estrategias por constructor" }

