[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 60000
points_awarded = 1000
title = "¿Qué ventaja tiene git subtree sobre git submodule?"
answer_mode = "MultipleAnswers"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "El código del subtree se incluye directamente en el repositorio principal" }
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "No requiere comandos adicionales para que otros contribuyentes lo usen" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Solo funciona con repositorios públicos" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Permite ignorar cambios del repositorio externo automáticamente" }

