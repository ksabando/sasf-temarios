[[slides]]
[slides.MultipleChoice]
introduce_question = 5000
time_limit = 30000
points_awarded = 1000
title = "¿Cuál es la diferencia entre un tag ligero y un tag anotado en Git?"
answer_mode = "SingleAnswer"
[[slides.MultipleChoice.answers]]
correct = true
content = { Text = "Un tag anotado almacena el nombre del etiquetador, correo, fecha y un mensaje; un tag ligero es solo un puntero a un commit" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Un tag ligero almacena metadatos mientras que un tag anotado no" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Los tags anotados solo pueden crearlos los propietarios del repositorio" }
[[slides.MultipleChoice.answers]]
correct = false
content = { Text = "Los tags ligeros se almacenan en una base de datos separada de los tags anotados" }

